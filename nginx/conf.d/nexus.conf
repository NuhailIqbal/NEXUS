server {
    listen 80;
    server_name edmnexus.ai www.edmnexus.ai;

    # Called by third parties at https://<host>/<path> with NO /api prefix: the voice service's agent
    # tools (PUBLIC_API_URL + /tools/internal/...) and Google's OAuth redirect. Without these the
    # request falls through to the frontend, which answers POST with 405 and the tool call fails.
    location /tools/internal/ {
        proxy_pass http://edm-nexus-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /calendar/google/callback {
        proxy_pass http://edm-nexus-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://edm-nexus-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://edm-nexus-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

